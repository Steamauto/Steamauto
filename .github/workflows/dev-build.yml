name: Dev & Test Build
on:
  push:
    branches: [dev, test]
  workflow_dispatch:
jobs:
  Build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies and build
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          pdm install --check --no-self -G build
          pdm run python .github/scripts/add_build_info.py
          pdm run pyinstaller build.spec

      - name: Upload artifacts~
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.os }}-dist
          path: dist
          retention-days: 3
